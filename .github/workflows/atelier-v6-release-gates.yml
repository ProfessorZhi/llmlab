# Atelier V6 release gates — CPU-only, read-only, no environment secrets.
#
# Why a second workflow next to `atelier-v6-beta.yml`:
#   * `atelier-v6-beta.yml` only triggers on three long-lived branch names, so a
#     Lane branch or an integration PR gets no automation at all until it lands.
#   * it hard-requires Chrome and exits 1 when the runner has none. That is the
#     right call for *that* pipeline, but it means "no browser available" and
#     "browser acceptance failed" are indistinguishable in the result.
#
# This workflow separates two questions that used to share one answer:
#
#   * "CPU unit checks" — may pass with the browser job SKIPPED, and says so.
#     It reports, and is not the signal that release readiness rests on.
#   * "Release acceptance" — FAIL-CLOSED. It requires a browser to have been
#     detected *and* browser acceptance to have succeeded. A missing browser, a
#     skipped browser job and a detector that errored all fail this gate.
#
# That split exists because of a defect in the previous revision: a browser job
# reported as `skipped` matched none of the verdict's branches, so a run with
# zero browser E2E could exit 0 under a check named "Gate verdict" while printing
# a success message. Prose in a job summary cannot change a check's semantics —
# only the exit code can, so the decision now lives in release-gate-verdict.sh
# and is covered by tests/release/test_release_gate_verdict.py.
#
# Constraints this file must keep honouring (Lane Release/Legacy #50):
#   * CPU-only. No CUDA, no model weights, no long-running service is started.
#   * Read-only. `permissions: contents: read` only; no secret is referenced
#     anywhere in this file, and no job writes to the repository.
#   * No hidden green: a step that cannot run says so in the job summary.

name: Atelier V6 release gates (CPU-only, read-only)

on:
  push:
    branches:
      - integration/v6-operations-linux-auth-20261016
      - release/**
  pull_request:
    branches:
      - integration/v6-operations-linux-auth-20261016
  workflow_dispatch:

permissions:
  contents: read

# One run per ref: a superseded push is cancelled instead of stacking another
# full Python/Node pass on the same box.
concurrency:
  group: v6-release-gates-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  # ---------------------------------------------------------------------------
  # The design-provenance chain: prototypes/v5 (frozen) -> prototypes/v6 -> web/.
  # Every link is recomputed, not asserted.
  # ---------------------------------------------------------------------------
  frozen-design-and-derivation:
    name: V5 frozen design + V6 derivation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Independent literals, deliberately NOT imported from the tool sources.
      # `derive-from-v5.mjs` and `extract-from-prototype.mjs` also pin these;
      # repeating them here means a silent edit of the JS constants alone still
      # fails the build. Read from the committed blob (not the worktree) so a
      # runner with core.autocrlf=true cannot produce a false mismatch.
      #
      # expected_v6 was re-pinned by the Phase B integration candidate (Issue
      # #59). Release #51 wrote it against its own baseline 7fcc7d4f, where V6
      # hashed a7ba7a6c…; UI #54 then changed prototypes/v6/index.html, so the
      # composed tree derives 883a16c8…. The V6.1 frontend completion branch
      # (Issue #56) then changed prototypes/v6/additions.{html,css} and re-pinned
      # it to bc145702…. The V1 production-demo-gate branch (Issue #66, PR
      # #86/#93) changed prototypes/v6/additions.html again, so V6 now derives
      # b05e7544…; Release #69 measured that with `derive-from-v5.mjs --check`
      # rather than copying a document. The frozen V5 authority is unchanged —
      # only the derived V6 hash moved. This stays a literal: computing it here
      # would make the gate agree with whatever the tree happens to contain.
      - name: Frozen design sources are byte-identical
        run: |
          set -euo pipefail
          expected_v5=04003f5c4788a1a52849afd14266941b0e5458f28e059cb602dc53adae95c7bf
          expected_v6=b05e754453edfb5238249957dd1e622d452bbff57cbdf951eb7d4ee5fa7f4573
          actual_v5=$(git cat-file blob HEAD:prototypes/v5/index.html | sha256sum | cut -d' ' -f1)
          actual_v6=$(git cat-file blob HEAD:prototypes/v6/index.html | sha256sum | cut -d' ' -f1)
          echo "prototypes/v5/index.html $actual_v5"
          echo "prototypes/v6/index.html $actual_v6"
          [ "$actual_v5" = "$expected_v5" ] || { echo "::error::prototypes/v5/index.html drifted from the frozen authority ($actual_v5)"; exit 1; }
          [ "$actual_v6" = "$expected_v6" ] || { echo "::error::prototypes/v6/index.html drifted from v5 + additions ($actual_v6)"; exit 1; }

      - name: V6 is exactly V5 plus the committed additions
        run: node prototypes/v6/derive-from-v5.mjs --check

      - name: web/ is exactly the generator output for prototypes/v6
        run: node web/tools/extract-from-prototype.mjs --check

      - name: Generated files were not rewritten by the checks
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::the derivation checks wrote to the worktree; they must be read-only"
            git status --porcelain
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Python: the stdlib-only backend/CLI/BFF suites.
  # ---------------------------------------------------------------------------
  python-tests:
    name: Python regression (CPU-only)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: unittest discovery over tests/
        run: python -m unittest discover -s tests -t . -v

  # ---------------------------------------------------------------------------
  # Node: front-end + BFF contract suites (browser suite excluded; see below).
  # ---------------------------------------------------------------------------
  node-tests:
    name: Node regression (CPU-only)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Front-end and BFF contract tests
        run: npm test

      # `npm test` globs tests/*.test.js + tests/web-features + tests/infra, so the
      # Linux-login contract suites under tests/auth-ui/ are not covered by it.
      # Only browser.auth-ui.test.mjs needs a browser; these three are pure logic
      # and run here, which is also why they are listed file by file rather than
      # as `node --test tests/auth-ui/`.
      - name: Linux login contract suites (browser-free)
        run: >-
          node --test
          tests/auth-ui/auth-core.test.mjs
          tests/auth-ui/auth-linux-readiness.test.mjs
          tests/auth-ui/mock-server.test.mjs

  browser-available:
    name: Detect a real browser
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      chrome: ${{ steps.detect.outputs.chrome }}
      path: ${{ steps.detect.outputs.path }}
    steps:
      - id: detect
        shell: bash
        run: |
          set -euo pipefail
          if command -v google-chrome >/dev/null 2>&1; then
            echo "path=$(command -v google-chrome)" >> "$GITHUB_OUTPUT"
            echo "chrome=true" >> "$GITHUB_OUTPUT"
          elif command -v chromium >/dev/null 2>&1; then
            echo "path=$(command -v chromium)" >> "$GITHUB_OUTPUT"
            echo "chrome=true" >> "$GITHUB_OUTPUT"
          elif command -v chromium-browser >/dev/null 2>&1; then
            echo "path=$(command -v chromium-browser)" >> "$GITHUB_OUTPUT"
            echo "chrome=true" >> "$GITHUB_OUTPUT"
          else
            echo "chrome=false" >> "$GITHUB_OUTPUT"
            echo "No Chrome/Chromium on this runner."
          fi

  browser-acceptance:
    name: Browser acceptance
    needs: browser-available
    if: needs.browser-available.outputs.chrome == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Export the detected browser path
        shell: bash
        env:
          DETECTED_PATH: ${{ needs.browser-available.outputs.path }}
        run: |
          set -euo pipefail
          if [ -z "$DETECTED_PATH" ] || [ ! -x "$DETECTED_PATH" ]; then
            echo "::error::browser job started but the detected browser is unusable: '$DETECTED_PATH'" >&2
            exit 1
          fi
          echo "CHROME_PATH=$DETECTED_PATH" >> "$GITHUB_ENV"

      - name: Browser E2E regression
        run: npm run test:browser

      # The browser half of the Linux-login contract. It lives in tests/auth-ui/
      # rather than tests/browser/, so `npm run test:browser` does not reach it,
      # and it fails (rather than skips) when no browser is present — which is why
      # it belongs in this job and not in node-tests.
      - name: Linux login browser acceptance
        run: node --test tests/auth-ui/browser.auth-ui.test.mjs

  # ---------------------------------------------------------------------------
  # Informative CPU-only report. Browser absence is stated, not treated as a
  # pass, and cannot make this job succeed or fail.
  # ---------------------------------------------------------------------------
  cpu-unit-checks:
    name: CPU unit checks (informative)
    needs: [frozen-design-and-derivation, python-tests, node-tests, browser-available, browser-acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (for the verdict script)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Report CPU-only unit results
        shell: bash
        env:
          DESIGN_RESULT: ${{ needs.frozen-design-and-derivation.result }}
          PY_RESULT: ${{ needs.python-tests.result }}
          NODE_RESULT: ${{ needs.node-tests.result }}
          BROWSER_AVAILABLE: ${{ needs.browser-available.outputs.chrome }}
          BROWSER_RESULT: ${{ needs.browser-acceptance.result }}
        run: |
          bash .github/workflows/release-gate-verdict.sh --mode cpu \
            --design "$DESIGN_RESULT" \
            --python "$PY_RESULT" \
            --node "$NODE_RESULT" \
            --browser-available "$BROWSER_AVAILABLE" \
            --browser-result "$BROWSER_RESULT"

  # ---------------------------------------------------------------------------
  # Release acceptance. FAIL-CLOSED: no browser evidence means no green here.
  # ---------------------------------------------------------------------------
  release-acceptance:
    name: Release acceptance (fail-closed)
    needs: [frozen-design-and-derivation, python-tests, node-tests, browser-available, browser-acceptance]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout (for the verdict script)
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Decide release acceptance
        shell: bash
        env:
          DESIGN_RESULT: ${{ needs.frozen-design-and-derivation.result }}
          PY_RESULT: ${{ needs.python-tests.result }}
          NODE_RESULT: ${{ needs.node-tests.result }}
          BROWSER_AVAILABLE: ${{ needs.browser-available.outputs.chrome }}
          BROWSER_RESULT: ${{ needs.browser-acceptance.result }}
        run: |
          bash .github/workflows/release-gate-verdict.sh --mode release \
            --design "$DESIGN_RESULT" \
            --python "$PY_RESULT" \
            --node "$NODE_RESULT" \
            --browser-available "$BROWSER_AVAILABLE" \
            --browser-result "$BROWSER_RESULT"
