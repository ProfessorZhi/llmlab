name: Atelier V6 Beta (isolated CPU regression)

on:
  push:
    branches:
      - integration/atelier-v6-beta-20261016
      - fix/v6-compute-subpage-20261016
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CUDA_VISIBLE_DEVICES: ""
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout non-production integration
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Frontend and BFF contract tests
        run: npm test
      - name: Generated UI reproducibility
        run: npm run verify:extract
      - name: Python CPU-only regression
        run: python -m unittest discover -s tests -t .
      - name: Require real Chrome for browser acceptance
        shell: bash
        run: |
          if command -v google-chrome >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v google-chrome)" >> "$GITHUB_ENV"
          elif command -v chromium >/dev/null 2>&1; then
            echo "CHROME_PATH=$(command -v chromium)" >> "$GITHUB_ENV"
          else
            echo "Chrome/Chromium unavailable; browser acceptance must not silently skip"
            exit 1
          fi
      - name: Browser E2E regression
        run: npm run test:browser
