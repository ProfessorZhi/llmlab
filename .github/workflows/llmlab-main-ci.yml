# Source-level regression only. A green run is NOT a Dell host, GPU, PAM,
# Gateway, browser E2E, security-history, or production deployment acceptance.
name: llmlab CPU checks (non-release)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llmlab-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python:
    name: Python unit regression
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Full stdlib unit suite
        run: python -m unittest discover -s tests -t .

  node:
    name: Node unit and generated UI checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node tests
        run: npm test
      - name: Verify frozen V5 to V6 derivation
        run: node prototypes/v6/derive-from-v5.mjs --check
      - name: Verify generated web output
        run: npm run verify:extract

  browser:
    name: Headless browser acceptance (non-release)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 24 for built-in WebSocket and CDP
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Require preinstalled Chrome or Chromium
        shell: bash
        run: |
          set -euo pipefail
          CHROME_PATH="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [[ -z "$CHROME_PATH" ]]; then
            echo "::error::Chrome/Chromium unavailable. Real-browser checks are NOT_VERIFIED; do not silently skip."
            exit 1
          fi
          "$CHROME_PATH" --version
          echo "CHROME_PATH=$CHROME_PATH" >> "$GITHUB_ENV"
      - name: Run real browser suite, one CDP browser test file at a time
        shell: bash
        env:
          ATELIER_INFRA_READONLY: "0"
        run: |
          set -euo pipefail
          node --version
          node --test --test-concurrency=1 tests/browser/*.test.js
