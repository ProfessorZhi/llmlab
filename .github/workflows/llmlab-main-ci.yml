# Source-level regression only. A green run is NOT a Dell host, GPU, PAM,
# Gateway, browser E2E, security-history, or production deployment acceptance.
#
# Thin by design (2026-10-23): the console is the only shipped UI. The retired
# Atelier page stays in the tree for reference but is no longer served as the
# front door, so its packaging/browser suites were removed rather than kept
# permanently red. What remains are the checks that fail for real defects:
# stdlib unit tests (which include the public-tree security scan and the docs
# boundary tests) and the Node tests for the console's front-end logic.
name: llmlab CPU checks (non-release)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: llmlab-cpu-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CUDA_VISIBLE_DEVICES: ""
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  python:
    name: Python unit regression
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Stdlib unit suite
        run: python -m unittest discover -s tests -t .

  node:
    name: Node unit checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Node tests
        run: npm test
